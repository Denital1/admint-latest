name: admint
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  environment:
    DJANGO_SETTINGS_MODULE: config.production
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
    FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    CACHE_URL: ${CACHE_URL:?Set CACHE_URL}
    DATABASE_URL: postgresql://${APP_DATABASE_USER:?Set APP_DATABASE_USER}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  volumes:
    - static:/app/staticfiles
services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?Set APP_DATABASE_USER}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/10-admint-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["sh", "-c", "python manage.py check --deploy --fail-level WARNING && python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    restart: "no"
  backend:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import Request,urlopen; urlopen(Request('http://127.0.0.1:8000/api/ready/',headers={'Host':'backend','X-Forwarded-Proto':'https'}),timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_started}
      backend: {condition: service_healthy}
    restart: unless-stopped
  backup:
    image: postgres:17-bookworm
    environment:
      PGHOST: database
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${APP_DATABASE_USER:?Set APP_DATABASE_USER}
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    command: ["sh", "/backup-postgres.sh"]
    volumes:
      - ./backup-postgres.sh:/backup-postgres.sh:ro
      - backups:/backups
    depends_on:
      database: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name '*.dump' -mmin -1500 -print -quit | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5m
    restart: unless-stopped
volumes:
  database:
  static:
  backups:
  caddy_data:
  caddy_config:
